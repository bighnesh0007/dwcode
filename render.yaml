# Render Blueprint — DWCode backend (server/)
#
# WHY RENDER AND NOT VERCEL
# The backend is a long-lived Express process: it calls app.listen(), holds a
# MongoDB connection pool, and runs a periodic upstream heartbeat. None of that
# survives a serverless runtime that freezes between invocations. The Next.js
# frontend (client/) is deployed separately on Vercel.
#
# This blueprint also keeps the FROZEN legacy contract on its existing host, so
# POST /api/transform, /health and /healthcheck stay byte-compatible for callers
# still pointing at the old URL.
#
# Apply with: Render Dashboard → Blueprints → New Blueprint Instance.
# Secrets are declared with `sync: false`, which means "prompt me in the
# dashboard, never store the value in git".

# ── Shared secret between the API server and the compiler ────────────────────
# Generated once by Render and injected into BOTH services from this group, so
# the value never exists in git and cannot drift between the two.
envVarGroups:
  - name: dwcode-compiler-shared
    envVars:
      - key: COMPILER_AUTH_TOKEN
        generateValue: true

services:
  - type: web
    name: dwcode-server
    runtime: node
    # NOTE: `rootDir: server` was REMOVED in REF-01.
    #
    # The repo is now an npm workspace, so the ONLY lockfile is at the root and
    # `npm ci` inside server/ has nothing to install from. Builds therefore run
    # from the repository root and target the workspace explicitly.
    #
    # See docs/runbooks/deployment-prerequisites.md — the blueprint must be
    # RE-APPLIED for these commands to take effect.
    plan: free
    region: oregon
    branch: master
    autoDeployTrigger: commit

    # `build:shared` must precede `build:server`: the server consumes
    # @dwcode/shared as compiled dist/ output, not as TypeScript source.
    buildCommand: npm ci && npm run build:shared && npm run build:server
    startCommand: npm run start:server

    # Cheap, dependency-free endpoint — deliberately not /healthcheck, which
    # probes the upstream compiler and returns 503 when that is degraded. A
    # flaky third party must not make Render restart this service.
    healthCheckPath: /health

    envVars:
      # ── Runtime ────────────────────────────────────────────────────────────
      # Pinned rather than floating: package.json says ">=22", which Render
      # would otherwise auto-upgrade on each new major release.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render injects PORT and expects the process to bind it; src/config reads it.
      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: "false"
      # Render terminates TLS upstream, so trust the proxy or every client IP
      # used for rate limiting collapses to Render's edge address.
      - key: TRUST_PROXY
        value: "true"

      # ── DataWeave compiler (frozen legacy contract) ────────────────────────
      # NOTE: this must be the real upstream compiler, never this service's own
      # public URL — that would make it proxy to itself in a loop.
      - key: DW_COMPILER_URL
        value: https://dataweave-playground-h1p7.onrender.com/api/transform
      - key: DW_VERSION
        value: 2.3.0
      - key: HEALTHCHECK_URL
        value: https://dataweave-playground-h1p7.onrender.com/healthCheck
      - key: HEALTHCHECK_ENABLED
        value: "true"

      # ── Own compiler service (ADR-006) ─────────────────────────────────────
      # Stays "upstream" when this blueprint is applied, so applying it changes
      # nothing users see. Flip to "service" in the dashboard only after
      # compiler/parity/check-parity.mjs passes on the full corpus; flipping
      # back is the rollback.
      - key: DW_BACKEND
        value: upstream
      - key: COMPILER_SERVICE_URL
        fromService:
          type: pserv
          name: dwcode-compiler
          property: hostport
      - fromGroup: dwcode-compiler-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dwcode-redis
          property: connectionString
      # Per instance. Each submission grades its cases one at a time, so this
      # is also the ceiling on concurrent calls from this instance to the compiler.
      - key: GRADING_CONCURRENCY
        value: "8"

      # ── Weekly contest scheduler ───────────────────────────────────────────
      - key: WEEKLY_CONTEST_ENABLED
        value: "true"

      # ── Set these in the dashboard (never committed) ───────────────────────
      # Database
      - key: MONGODB_URI
        sync: false
      # Clerk — required for any authenticated endpoint
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # Your Clerk user id; grants super-admin
      - key: SUPER_ADMIN_USER_ID
        sync: false
      # Must include the deployed Vercel origin, comma-separated, or the browser
      # will be blocked by CORS.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      # AI problem generation / playground assistance
      - key: GEMINI_API_KEY
        sync: false
      # GitHub integration. OAUTH_STATE_SECRET signs the OAuth `state` because
      # cookies are not viable cross-origin.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      # 64 hex chars (32 bytes) — AES-256-GCM key for GitHub tokens at rest.
      # Generate: node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))'
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Razorpay sponsorship. All three are required for the `payments`
      # capability; with any missing, sponsorship endpoints report 503 rather
      # than half-working.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ── DataWeave compiler (compiler/, ADR-006) ────────────────────────────────
  # A PRIVATE service: no public URL, reachable only from services in this
  # account's private network. It runs untrusted code.
  #
  # SIZING (measured, docs/vault/Operations/Compiler Capacity Plan.md): each
  # worker is ~300 MB RSS, the supervisor ~150 MB. "standard" (2 GB, 1 CPU)
  # holds 2 workers with headroom and served 500 concurrent users at p95 10 ms
  # in the load test (4 workers, locally). "starter" (512 MB) cannot hold even
  # one worker at these settings — see the plan before downsizing.
  #
  # NOTE: Render does not expose read-only rootfs / cap_drop / pid limits, so
  # in production the boundary is: engine privileges off + one-process-per-
  # worker kill switch + empty worker environment + non-root container.
  - type: pserv
    name: dwcode-compiler
    runtime: docker
    plan: standard
    region: oregon
    branch: master
    dockerfilePath: ./compiler/Dockerfile
    dockerContext: ./compiler
    buildFilter:
      paths:
        - compiler/**
    envVars:
      - key: APP_ENV
        value: production # makes a missing/short COMPILER_AUTH_TOKEN fatal at boot
      - fromGroup: dwcode-compiler-shared
      - key: COMPILER_WORKERS
        value: "2"
      - key: COMPILER_WORKER_HEAP_MB
        value: "256"
      - key: COMPILER_TIMEOUT_MS
        value: "5000"

  # ── Redis: shared rate limits, result cache, grading queue ────────────────
  - type: keyvalue
    name: dwcode-redis
    plan: starter
    region: oregon
    # Private network only: no address may connect from the internet.
    ipAllowList: []
    # BullMQ requires noeviction: an evicted job key is a lost submission.
    maxmemoryPolicy: noeviction
