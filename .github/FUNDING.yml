# Enables the "Sponsor" button on the GitHub repository page.
# Docs: https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
#
# NOTE: `github:` only renders once the account is enrolled in GitHub Sponsors
# (https://github.com/sponsors). Until then the button stays hidden.
github: [bighnesh0007]

# Uncomment and point at the in-app Razorpay sponsorship page once it is deployed.
custom: ["https://dwcode.vercel.app/sponsor"]

# Other platforms, left unset:
# patreon:
# open_collective:
# ko_fi:
# buy_me_a_coffee:
# polar:
