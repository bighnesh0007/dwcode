name: ✨ Feature request
description: Suggest something DWCode should do
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need, not the solution. What are you unable to do today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations: { required: true }
  - type: dropdown
    id: audience
    attributes:
      label: Who benefits
      options:
        - Someone learning DataWeave
        - Someone preparing for MuleSoft certification
        - A working developer solving a real integration
        - Contributors / maintainers
    validations: { required: true }
  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I checked the roadmap in `docs/audit/08-product-roadmap.md`
          required: true
        - label: I searched existing issues and discussions
          required: true
