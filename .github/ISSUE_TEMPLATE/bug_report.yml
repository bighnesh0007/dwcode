name: 🐛 Bug report
description: Something in the app misbehaves
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        If a specific **problem/question** has a wrong expected output, use the
        "Report an issue" button on that problem instead — it goes straight to
        the moderation queue with the problem attached.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playground
        - Problem workspace / submissions
        - Contests
        - Leaderboard / profile
        - Blog / discussion
        - Auth
        - Admin
        - Other / not sure
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Browser & OS
      placeholder: Chrome 141 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Console or network errors
      description: Paste any red errors from devtools. **Redact tokens and cookies.**
      render: text
