name: CI

# Monorepo pipeline: client/ (Next.js, deployed to Vercel) and server/
# (Express + TypeScript, deployed to Render). Deployment itself is handled by
# those platforms' own Git integrations — this workflow only gates correctness.

# Runs on pushes to master AND on pull requests targeting it.
#
# The pull_request trigger was previously absent, so a failure was only
# discovered once the change was already on master (audit finding L-6, task
# OPS-03). Branch protection should now require: frontend, backend, security,
# dependencies and image.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Superseded runs on the same ref are cancelled; a merge queue push should not
# wait behind an obsolete build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the "node": ">=22" engines field in both packages. Pinned so a new
  # Node major cannot break CI without an explicit bump here.
  NODE_VERSION: "22.x"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ── Which halves changed? ───────────────────────────────────────────────────
  # Both jobs below still RUN on every push (so required status checks always
  # report), but this lets each skip its expensive steps when untouched.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            server:
              - 'server/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'render.yaml'
              - '.github/workflows/**'

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend · client
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # REF-01: npm workspaces. The only lockfile is at the repo root, so the
      # install must run there — `npm ci` inside client/ has nothing to read.
      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      # @dwcode/shared is consumed as compiled dist/, so it must exist before
      # anything typechecks against it.
      - name: Build shared package
        working-directory: .
        run: npm run build:shared

      # Reused across runs so unchanged pages are not recompiled from scratch.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: client/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('client/**/*.[jt]s', 'client/**/*.[jt]sx', 'packages/**/*.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Typecheck
        if: needs.changes.outputs.client == 'true'
        run: npm run typecheck

      - name: Lint
        if: needs.changes.outputs.client == 'true'
        run: npm run lint

      - name: Test
        if: needs.changes.outputs.client == 'true'
        run: npm test

      - name: Build
        if: needs.changes.outputs.client == 'true'
        run: npm run build
        env:
          # Clerk's publishable key is required at build time. It is a PUBLIC
          # key (it ships in the browser bundle), so the repo secret is used
          # when configured and a syntactically valid dummy otherwise — that
          # keeps builds working on forks, where secrets are unavailable.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: >-
            ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            || 'pk_test_Y2ktZHVtbXktZm9yLWJ1aWxkLW9ubHkk' }}
          NEXT_PUBLIC_API_URL: >-
            ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          NEXT_PUBLIC_APP_URL: >-
            ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:8000' }}

      - name: Skipped
        if: needs.changes.outputs.client != 'true'
        run: echo "No changes under client/ — checks skipped."

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend · server
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Build shared package
        working-directory: .
        run: npm run build:shared

      - name: Typecheck
        if: needs.changes.outputs.server == 'true'
        run: npm run typecheck

      - name: Lint
        if: needs.changes.outputs.server == 'true'
        run: npm run lint

      # Includes the 25 characterization tests that pin the frozen legacy
      # DataWeave contract — the safety net for redeploying the live proxy.
      - name: Test
        if: needs.changes.outputs.server == 'true'
        run: npm test
        env:
          NODE_ENV: test
          HEALTHCHECK_ENABLED: "false"

      # Compiles with the same command Render runs, so a build break surfaces
      # here rather than during deploy.
      - name: Build
        if: needs.changes.outputs.server == 'true'
        run: npm run build

      - name: Skipped
        if: needs.changes.outputs.server != 'true'
        run: echo "No changes under server/ — checks skipped."

  # ── Repository hygiene ──────────────────────────────────────────────────────
  security:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No secret-bearing files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)\.clerk/|\.pem$|\.key$'; then
            echo "::error::A secret-bearing file is tracked in git (listed above)."
            exit 1
          fi
          echo "OK — no tracked env/key files."

      - name: No live API keys or access tokens in tracked files
        run: |
          # Credentials that must never be committed. This workflow is excluded
          # so the patterns themselves do not match.
          #
          # GitHub tokens were MISSING from this list until a real one was
          # nearly pasted into the repo — a committed `ghp_…` would have passed
          # CI silently. `gh[pousr]_` covers personal, OAuth, user-to-server,
          # server-to-server and refresh tokens; `github_pat_` covers the
          # fine-grained format.
          # Built by concatenation rather than a backslash-continued regex:
          # a line-continuation inside the quoted pattern leaves a literal
          # backslash, git grep dies with "Trailing backslash", and the `if`
          # reads that failure as "nothing found" — a scanner that always passes.
          PATTERN='gh[pousr]_[A-Za-z0-9]{36}'
          PATTERN="$PATTERN|github_pat_[A-Za-z0-9_]{22,}"
          PATTERN="$PATTERN|rzp_live_[A-Za-z0-9]{10}"
          PATTERN="$PATTERN|sk_live_[A-Za-z0-9]{10}"
          PATTERN="$PATTERN|pk_live_[A-Za-z0-9]{10}"
          PATTERN="$PATTERN|sk-[A-Za-z0-9]{20,}"
          PATTERN="$PATTERN|AIza[0-9A-Za-z_-]{35}"
          PATTERN="$PATTERN|xox[baprs]-[A-Za-z0-9-]{10,}"
          PATTERN="$PATTERN|-----BEGIN [A-Z ]*PRIVATE KEY-----"

          # Prove the pattern still matches before trusting a clean result — a
          # broken regex must fail the job, not silently pass it.
          CANARY="ghp_$(printf 'A%.0s' $(seq 36))"
          if ! printf '%s\n' "$CANARY" | grep -qE "$PATTERN"; then
            echo "::error::Secret-scan self-test FAILED — the pattern no longer matches a known token shape."
            exit 1
          fi

          if git grep -nIE "$PATTERN" -- . ':!*.md' ':!.github/workflows/*'; then
            echo "::error::A credential appears to be committed. Revoke it, then purge it from history."
            exit 1
          fi
          echo "OK — no credentials found (self-test passed)."

      - name: Exactly one lockfile, at the workspace root
        run: |
          test -f package-lock.json || { echo "::error::root package-lock.json missing"; exit 1; }
          # A stale per-package lockfile silently shadows the root one and
          # reintroduces the split dependency trees REF-01 removed.
          for dir in client server packages/shared; do
            if [ -f "$dir/package-lock.json" ]; then
              echo "::error::$dir/package-lock.json must not exist — this repo uses npm workspaces."
              exit 1
            fi
          done
          echo "OK — single root lockfile, no shadowing lockfiles."

  # ── Dependency vulnerabilities ──────────────────────────────────────────────
  # The audit could not run `npm audit` (no Node available in that environment),
  # so the CVE status of the dependency tree was explicitly UNKNOWN — recorded as
  # audit finding L-7. This job makes it known, and keeps it known.
  #
  # `--omit=dev` because a vulnerable build-time package is a different (lower)
  # risk than one shipped to production. Dev-tree issues are surfaced as a
  # warning below rather than failing the build.
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Uses scripts/audit-gate.mjs rather than raw `npm audit --audit-level=high`.
      # Some advisories are bundled inside a framework with no forward fix — for
      # these, npm's only suggested "fix" is a major DOWNGRADE (right now it would
      # install next@9.3.3, taking the app from Next 16 to Next 9). The gate lets
      # such advisories be accepted with a written justification and an EXPIRY
      # date, so they get re-reviewed instead of silently ignored forever.
      - name: Audit production dependencies
        run: |
          status=0
          node scripts/audit-gate.mjs client || status=1
          node scripts/audit-gate.mjs server || status=1
          if [ "$status" -ne 0 ]; then
            echo "::error::Unaccepted (or expired) high/critical advisory in a production dependency. See scripts/audit-gate.mjs."
            exit 1
          fi

      - name: Audit dev dependencies (report only)
        continue-on-error: true
        run: |
          for dir in client server; do
            echo "── $dir (full tree) ──────────────────────────────────────"
            npm --prefix "$dir" audit --audit-level=critical || \
              echo "::warning::Advisories present in $dir dev tree — review, not blocking."
          done

  # ── Container image ─────────────────────────────────────────────────────────
  # Nothing in CI built this image, which is exactly why it sat on an EOL
  # `node:18-alpine` base while both package.json files declared ">=22"
  # (audit finding H-8). Building it here means that class of drift fails the
  # build instead of surviving into a release.
  image:
    name: Docker image builds
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dwcode:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Base image matches the declared engines field
        run: |
          # Guards the specific drift that finding H-8 was: the Dockerfile's Node
          # major silently falling behind `engines.node`.
          actual=$(docker run --rm --entrypoint node dwcode:ci --version | sed -E 's/^v([0-9]+).*/\1/')
          echo "image node major: $actual, CI NODE_VERSION: ${NODE_VERSION}"
          if [ "$actual" -lt 22 ]; then
            echo "::error::Image runs Node $actual but package.json requires >=22."
            exit 1
          fi
          echo "OK — image Node $actual satisfies engines >=22."
