name: Release drafter

# Keeps a draft GitHub Release up to date with every merged PR, grouped by
# label (.github/release-drafter.yml). Publishing it is a deliberate, manual
# step: Releases → edit draft → Publish.

on:
  push:
    branches: [master]
  # PR events run only the autolabeler (labels from the conventional title).
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create/update the draft release
      pull-requests: write # autolabeler
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          # Never touch the draft release from a PR event.
          disable-releaser: ${{ github.event_name == 'pull_request_target' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
