name: CodeQL

# Static analysis for security bugs in the TypeScript code and in these
# workflows. Results appear under Security → Code scanning.
#
# This is CodeQL "advanced setup". Do NOT also enable "default setup" in the
# repository settings — GitHub rejects uploads when both are on.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1" # weekly, catches newly published queries

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality adds maintainability findings to the security set.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
