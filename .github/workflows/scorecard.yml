name: OpenSSF Scorecard

# Scores the repository's supply-chain security practices (branch protection,
# pinned dependencies, token permissions, …). Findings appear under
# Security → Code scanning, and the score is published for the README badge.

on:
  push:
    branches: [master]
  schedule:
    - cron: "41 5 * * 2"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish results to the public Scorecard API
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
